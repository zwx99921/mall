server:
  port: 9100
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain
    min-response-size: 2048

spring:
  # ==================== 文件上传 ====================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # ==================== 数据源 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.1.10}:${MYSQL_PORT:3306}/mall_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1

  # ==================== Redis ====================
  redis:
    host: 192.168.1.10
    port: 6379
    password: 123456
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.we.mall.admin.entity
  configuration:
    map-underscore-to-camel-case: true
  #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# ==================== Mall 配置 ====================
mall:
  # 安全
  security:
    enabled: true
    gateway-mode: true    # 不强制登录，具体接口用 @RequiresLogin
    required: false        # 网关模式：从 X-Internal-* header 还原
  # Redis
  redis:
    enabled: true
    null-value-ttl-seconds: 60
  session:
    enabled: true
    timeout-seconds: 604800
    sliding-expiration: true
    session-id-length: 32
    clients:
      admin:
        key-prefix: "mall:session:admin:"
        device-types: [ PC ]
        same-device-kick: true
        max-per-device: 1
  # 文档
  swagger:
    enabled: true
    title: 管理服务 API
    description: 管理服务接口文档
    version: 1.0.0
    contact-name: we
    contact-email: zwx99921@163.com

# ==================== Actuator ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 日志
logging:
  level:
    com.we.mall: debug