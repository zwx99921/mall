server:
  port: 9101
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain
    min-response-size: 2048

spring:
  # ==================== 文件上传 ====================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # ==================== 数据源 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.1.10}:${MYSQL_PORT:3306}/mall_file?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1

  # ==================== Redis ====================
  redis:
    host: 192.168.1.10
    port: 6379
    password: 123456
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.we.mall.modules.file.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# ==================== Mall 配置 ====================
mall:
  security:
    enabled: true
    gateway-mode: true
    required: false
  redis:
    enabled: true
    null-value-ttl-seconds: 60
  session:
    enabled: true
    timeout-seconds: 604800
    sliding-expiration: true
    session-id-length: 32
    clients:
      admin:
        key-prefix: "mall:session:admin:"
        device-types: [ PC ]
        same-device-kick: true
        max-per-device: 1

  # ==================== 文件服务 ====================
  file:
    storage-type: local
    max-size: 10485760
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - bmp
      - webp
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt
      - csv
      - zip
      - rar
    local:
      base-path: /data/mall/file
      url-prefix: http://localhost:9101/file
    presign:
      secret: "change-me-file-presign-secret"
      upload-expire-seconds: 600
      download-expire-seconds: 1800
      used-token-ttl-seconds: 1800

  # 文档
  swagger:
    enabled: true
    title: 文件服务 API
    description: 文件服务接口文档
    version: 1.0.0
    contact-name: we
    contact-email: zwx99921@163.com

# ==================== Actuator ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.we.mall: debug