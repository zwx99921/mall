# *************** 基础配置 ***************
server.servlet.contextPath=/nacos
server.port=8848
# *************** 数据源配置 ***************
spring.datasource.platform=mysql
db.num=1
db.url.0=jdbc:mysql://mall-mysql:3306/mall_nacos_config?characterEncoding=utf8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
db.userEntity=root
db.password=root
# *************** 连接池配置 ***************
db.pool.config.connectionTimeout=30000
db.pool.config.maximumPoolSize=50
db.pool.config.minimumIdle=10
db.pool.config.idleTimeout=600000
# *************** Nacos 核心配置 ***************
# *************** 认证配置 ***************
# 开启默认认证
nacos.core.auth.enabled=true
nacos.core.auth.system.type=nacos
nacos.core.auth.server.identity.key=mallServerIdentity
nacos.core.auth.server.identity.value=MallSecureClusterCredential2026!
nacos.core.auth.plugin.nacos.token.secret.key=TWFsbFNlY3VyZVRva2VuU2VjcmV0S2V5MjAyNkZvck5hY29zISE=
# 自定义密钥（生产环境务必修改，且所有节点保持一致）旧版本遗留项，2.2.3 已不用
#nacos.core.auth.default.token.secret.key=xK9mP2nQ5rS8vW3yZ7cF4jH6tL1oR0eUxK9mP2nQ5rS8vW3yZ7cF4jH6tL1oR0eU
nacos.core.auth.caching.enabled=true
nacos.core.auth.enable.userAgentAuthWhite=false
# *************** 空服务清理配置 ***************
nacos.naming.clean.expired-metadata.enabled=true
nacos.naming.clean.empty-service.enabled=true
nacos.naming.clean.disabled=false
# *************** 控制台配置 ***************
nacos.console.ui.enabled=true
# *************** 监控配置 ***************
management.endpoints.web.exposure.include=health,info
management.metrics.export.elastic.enabled=false
management.metrics.export.influx.enabled=false
# *************** Tomcat 日志 ***************
# server.tomcat.accesslog.enabled=true
# server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D %{User-Agent}i
# server.tomcat.basedir=/home/nacos/logs
# *************** 日志配置 ***************
logging.level.root=INFO
logging.level.com.alibaba.nacos=INFO

